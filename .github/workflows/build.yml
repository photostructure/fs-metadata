name: Build & Prepare Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release - {0}', inputs.version) || format('Build - {0}', github.ref_name) }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 ensures clang-tidy analyzes src/darwin/*. The script excludes
        # source directories for platforms other than its current host.
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux analysis tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy bear build-essential libblkid-dev uuid-dev

      - name: Install macOS analysis tools
        if: runner.os == 'macOS'
        run: |
          # The runner image pre-taps aws/tap (for aws-sam-cli), which Homebrew
          # now flags as untrusted on every invocation. We only install from
          # homebrew/core, so drop the tap instead of granting it trust.
          brew untap aws/tap || true
          brew install llvm bear

      - name: Install Windows analysis tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = $false
          $paths = @(
            "C:\Program Files\LLVM\bin\clang-tidy.exe",
            "C:\Program Files (x86)\LLVM\bin\clang-tidy.exe"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "Found clang-tidy at: $path"
              $found = $true
              break
            }
          }
          if (-not $found) {
            choco install llvm -y
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          }
          clang-tidy --version

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run linters
        run: npm run lint
      - name: Build JavaScript and declarations
        run: npm run build:dist
      - name: Verify package exports
        run: npm run check:exports
      - name: Verify the tested source stayed unchanged
        run: git diff --exit-code

  prebuild-mac-x64:
    name: Build macOS x64 prebuild
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - name: Record the prebuild identity and checksum
        run: |
          npm run release:prebuild-artifact -- \
            --project-root . \
            --artifact-root prebuild-artifact \
            --target darwin-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-darwin-x64
          path: prebuild-artifact/
          if-no-files-found: error
      - run: git diff --exit-code

  prebuild-mac-arm64:
    name: Build macOS ARM64 prebuild
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - name: Record the prebuild identity and checksum
        run: |
          npm run release:prebuild-artifact -- \
            --project-root . \
            --artifact-root prebuild-artifact \
            --target darwin-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-darwin-arm64
          path: prebuild-artifact/
          if-no-files-found: error
      - run: git diff --exit-code

  prebuild-win-x64:
    name: Build Windows x64 prebuild
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - name: Record the prebuild identity and checksum
        shell: bash
        run: |
          npm run release:prebuild-artifact -- \
            --project-root . \
            --artifact-root prebuild-artifact \
            --target win32-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-win32-x64
          path: prebuild-artifact/
          if-no-files-found: error
      - run: git diff --exit-code

  prebuild-win-arm64:
    name: Build Windows ARM64 prebuild
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - name: Record the prebuild identity and checksum
        shell: bash
        run: |
          npm run release:prebuild-artifact -- \
            --project-root . \
            --artifact-root prebuild-artifact \
            --target win32-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-win32-arm64
          path: prebuild-artifact/
          if-no-files-found: error
      - run: git diff --exit-code

  prebuild-linux-glibc:
    name: Build glibc Linux ${{ matrix.arch }} prebuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build in Debian 11 for glibc 2.31 compatibility
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run build:linux-glibc
      - name: Record the prebuild identity and checksum
        env:
          PREBUILD_TARGET: linux-${{ matrix.arch }}-glibc
        run: |
          npm run release:prebuild-artifact -- \
            --project-root . \
            --artifact-root prebuild-artifact \
            --target "$PREBUILD_TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-linux-${{ matrix.arch }}-glibc
          path: prebuild-artifact/
          if-no-files-found: error
      - run: git diff --exit-code

  prebuild-linux-musl:
    name: Build musl Linux ${{ matrix.arch }} prebuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and inventory in Alpine Linux
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
          PREBUILD_TARGET: linux-${{ matrix.arch }}-musl
        run: |
          docker run --rm \
            -e PREBUILD_TARGET="$PREBUILD_TARGET" \
            -v "$PWD:/tmp/project" \
            --entrypoint /bin/sh \
            --platform "$DOCKER_PLATFORM" \
            node:22-alpine3.21 \
            -c 'apk add build-base git python3 py3-setuptools util-linux-dev linux-headers --update-cache && cd /tmp/project && npm ci --ignore-scripts && npm run build:native && npm run release:prebuild-artifact -- --project-root . --artifact-root prebuild-artifact --target "$PREBUILD_TARGET"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-linux-${{ matrix.arch }}-musl
          path: prebuild-artifact/
          if-no-files-found: error
      - run: git diff --exit-code

  test-mac-win:
    name: Test Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    needs:
      - prebuild-mac-x64
      - prebuild-mac-arm64
      - prebuild-win-x64
      - prebuild-win-arm64
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14, windows-latest, windows-11-arm]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuild-*
          path: .
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run tests
      - run: git diff --exit-code

  test-ubuntu:
    name: Test Node.js ${{ matrix.node-version }} on ${{ matrix.os }} ${{ matrix.arch }}
    needs: prebuild-linux-glibc
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        arch: [x64, arm64]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.arch == 'arm64' && format('{0}-arm', matrix.os) || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update
      - run: sudo apt-get install -y libblkid-dev uuid-dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuild-linux-*-glibc
          path: .
          merge-multiple: true
      - run: npm ci --ignore-scripts
      - run: npm run tests
      - run: git diff --exit-code

  test-alpine:
    name: Test Node.js ${{ matrix.node-version }} on Alpine ${{ matrix.arch }}
    needs: prebuild-linux-musl
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        node-version: [22, 24, 26]
        include:
          - arch: x64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuild-linux-*-musl
          path: .
          merge-multiple: true
      - name: Run tests in Alpine Linux
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
          NODE_VERSION: ${{ matrix.node-version }}
        run: |
          docker run --rm \
            -v "$PWD:/tmp/project" \
            --entrypoint /bin/sh \
            --platform "$DOCKER_PLATFORM" \
            "node:${NODE_VERSION}-alpine" \
            -c "apk add util-linux-dev bash valgrind --update-cache && cd /tmp/project && npm ci --ignore-scripts && npm run tests"
      - run: git diff --exit-code

  # The pack and verify-package jobs below rehearse publish.yaml's release path
  # on every push, driving the same scripts/release-package-cli.ts subcommands.
  # Without them, that procedure would first execute at tag time -- and a
  # workflow file is frozen at its tag, so a defect there costs a version.
  pack:
    name: Pack the release tarball
    needs:
      - prebuild-mac-x64
      - prebuild-mac-arm64
      - prebuild-win-x64
      - prebuild-win-arm64
      - prebuild-linux-glibc
      - prebuild-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify the release npm version
        run: test "$(npm --version)" = "11.17.0"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuild-*
          path: release-input/
          merge-multiple: true
      - name: Verify and assemble all eight prebuilds
        run: |
          npm run release:assemble-prebuilds -- \
            --project-root . \
            --source-root release-input \
            --destination-root prebuilds
      - name: Build JavaScript and declarations
        run: npm run build:dist
      - name: Verify package exports
        run: npm run check:exports
      - name: Pack and inventory the package
        run: |
          npm run release:pack-package -- \
            --project-root . \
            --artifact-dir package-artifact
      - run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package-artifact/
          if-no-files-found: error
          retention-days: 1

  verify-package:
    name: Verify packed package on ${{ matrix.os }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify the package-test npm version
        run: test "$(npm --version)" = "11.17.0"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifact/
      - name: Install the packed package with the dependency age gate
        # The checksummed tarball is the subject under test.
        run: | # zizmor: ignore[adhoc-packages]
          npm run release:install-package -- \
            --project-root . \
            --artifact-dir package-artifact \
            --install-root package-install
      - name: Install a different Node.js major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Load the packed package
        run: |
          npm run release:load-package -- \
            --project-root . \
            --install-root package-install
      - run: git diff --exit-code

  verify-package-alpine:
    name: Verify packed package on Alpine
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifact/
      - name: Install the packed package with the dependency age gate
        run: |
          docker run --rm \
            -v "$PWD:/tmp/project" \
            --entrypoint /bin/sh \
            node:24.19.0-alpine \
            -c 'test "$(npm --version)" = "11.17.0" && apk add util-linux-dev --update-cache && cd /tmp/project && npm ci --ignore-scripts && npm run release:install-package -- --project-root . --artifact-dir package-artifact --install-root package-install'
      - name: Load the packed package on a different Node.js major
        run: |
          docker run --rm \
            -v "$PWD:/tmp/project" \
            --entrypoint /bin/sh \
            node:26-alpine \
            -c 'apk add util-linux-dev --update-cache && cd /tmp/project && npm run release:load-package -- --project-root . --install-root package-install'
      - run: git diff --exit-code

  memory-tests:
    name: Memory tests on Node.js ${{ matrix.node-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblkid-dev uuid-dev build-essential valgrind clang
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:memory
        env:
          CI: "true"
      - name: Upload memory test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-test-results-${{ matrix.os }}-node${{ matrix.node-version }}
          path: |
            *.log
            valgrind-*.log
            asan-output.log
            core.*
            test-results/
          retention-days: 7
      - if: always()
        run: git diff --exit-code

  thread-sanitizer:
    name: ThreadSanitizer on Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libblkid-dev uuid-dev build-essential clang
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check:tsan
        env:
          CI: "true"
      - name: Upload ThreadSanitizer output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsan-results-${{ matrix.arch }}
          path: tsan-output.log
          retention-days: 7
      - if: always()
        run: git diff --exit-code

  release:
    name: Create signed release commit and tag
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    needs:
      - lint
      - test-mac-win
      - test-ubuntu
      - test-alpine
      - verify-package
      - verify-package-alpine
      - memory-tests
      - thread-sanitizer
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    concurrency:
      group: ${{ github.repository }}-release
      cancel-in-progress: false
      queue: single
    permissions:
      contents: write # Push the release commit and signed tag.
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This isolated job must push. It installs no dependencies and has no
          # npm publishing authority.
          persist-credentials: true

      - name: Verify the release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be dispatched from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$GITHUB_SHA" ]]; then
            echo "::error::$DEFAULT_BRANCH moved after this release run started; run it again"
            exit 1
          fi

      - name: Install the release Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify the release npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Set up SSH signing
        uses: photostructure/git-ssh-signing-action@abd2a642ab7d704f66193472b47c72375d85a0c1 # v2.0.1
        with:
          ssh-signing-key: ${{ secrets.SSH_SIGNING_KEY }}
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-user-email: ${{ secrets.GIT_USER_EMAIL }}

      - name: Bump the package version
        id: version
        env:
          BUMP: ${{ inputs.version }}
        run: |
          case "$BUMP" in
            patch|minor|major) ;;
            *)
              echo "::error::Unsupported version bump: $BUMP"
              exit 1
              ;;
          esac

          npm version "$BUMP" --no-git-tag-version --ignore-scripts

          if ! git diff --quiet -- . \
            ':(exclude)package.json' \
            ':(exclude)package-lock.json'; then
            echo "::error::The version bump changed unexpected files"
            git diff --name-only
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const pkg = require("./package.json")
            const lock = require("./package-lock.json")
            if (lock.version !== pkg.version || lock.packages[""].version !== pkg.version) {
              throw new Error("package.json and package-lock.json versions do not match")
            }
          '
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the signed release commit and annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json package-lock.json
          git commit -S -m "chore(release): $VERSION"
          git tag -s -m "Release $VERSION" "$TAG"

      - name: Push the commit and tag atomically
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"

  dispatch:
    name: Start tag-bound publishing
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      actions: write # Start the tag-bound publishing workflow.
    steps:
      - name: Start the publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run publish.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
